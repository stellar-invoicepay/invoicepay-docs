name: Docs
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node --test scripts/check-links.test.mjs
      - run: node scripts/check-links.mjs
      - uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: '0.4.52'
      - run: mdbook build
